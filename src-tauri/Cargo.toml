[package]
name = "specrails-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "specrails_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "specrails-desktop"
path = "src/main.rs"

[features]
native-browser-smoke = ["tauri/test"]

[[example]]
name = "native-browser-smoke"
path = "examples/native-browser-smoke.rs"
required-features = ["native-browser-smoke"]

[[example]]
name = "native-browser-popup-smoke"
path = "examples/native-browser-popup-smoke.rs"
required-features = ["native-browser-smoke"]

[[example]]
name = "native-mission-window-smoke"
path = "examples/native-mission-window-smoke.rs"
required-features = ["native-browser-smoke"]

[[example]]
name = "native-browser-multiwindow-smoke"
path = "examples/native-browser-multiwindow-smoke.rs"
required-features = ["native-browser-smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The native browser toolbar exposes browser_devtools in packaged builds too;
# keep this feature aligned with that command, not only debug_assertions.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
dirs-next = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# These are already transitive Tauri dependencies. Expose the public WebKit
# snapshot API directly so the interactive browser never streams screenshots.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKSnapshotConfiguration", "WKUIDelegate", "WKWebView"] }

# wayland-scanner 0.31.10 still pins vulnerable quick-xml 0.39.x. Upstream has
# landed the audited 0.41 bump but has not published a replacement crate yet.
# Pin the exact security-fix revision until the next crates.io release.
[patch.crates-io]
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs.git", rev = "d07c4f91f28b42e5a485823ffd9d8d5a210b1053" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

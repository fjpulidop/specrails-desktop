[package]
name = "specrails-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "specrails_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "specrails-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: devtools/Inspect Element is intentionally NOT force-enabled here. Tauri
# auto-enables devtools in debug builds (debug_assertions), so dev keeps the
# inspector while release builds ship WITHOUT it — this both removes the
# "embedded web page" Inspect Element entry from production and avoids shipping
# the WKWebView private devtools API (a macOS App Store blocker).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
dirs-next = "2"

# wayland-scanner 0.31.10 still pins vulnerable quick-xml 0.39.x. Upstream has
# landed the audited 0.41 bump but has not published a replacement crate yet.
# Pin the exact security-fix revision until the next crates.io release.
[patch.crates-io]
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs.git", rev = "d07c4f91f28b42e5a485823ffd9d8d5a210b1053" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

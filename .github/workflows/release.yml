name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-metadata-main
  cancel-in-progress: false

jobs:
  release:
    # workflow_run has elevated credentials. Never consume PR/fork artifacts or
    # execute their source; this path only admits a successful main push here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22.22.3
      - name: Ignore a superseded main result
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release-policy.mjs main-current
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        if: steps.main.outputs.current == 'true'
        with:
          release-type: node
          target-branch: main
          # A PAT is required so its new tag triggers the independently gated
          # npm and Desktop workflows; GITHUB_TOKEN suppresses those events.
          token: ${{ secrets.RELEASE_PAT }}

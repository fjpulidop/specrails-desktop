name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # Retry by selecting the exact existing release tag.

permissions:
  contents: read

concurrency:
  group: npm-publication-latest
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.3
      - name: Validate release tag, package version and checkout
        run: node scripts/release-policy.mjs tag
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-policy.mjs ci

  package:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run build
      - run: npm run test:scripts
      - name: Verify the exact distributable tarball
        run: npm run check:package -- --output artifacts/npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verified-npm-package
          path: artifacts/npm/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: verified-npm-package
          path: artifacts/npm
      - name: Validate the downloaded package and avoid duplicate publication
        id: package
        run: node scripts/release-policy.mjs npm-status
      # Two credentials, one preferred. npm trusted publishing exchanges this
      # job's OIDC identity (id-token: write) for a short-lived publish grant:
      # no stored token, nothing that expires or needs 2FA bypass. It needs
      # npm >= 11.5.1 (Node 22 ships 10.x) and the package's trusted publisher
      # to name this repository and workflow file on npmjs.com. Until that is
      # configured, a stored NPM_TOKEN keeps working: when the secret is set it
      # is used, when it is empty the job publishes through OIDC.
      - name: Select the npm credential
        id: credential
        if: steps.package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then echo "mode=token" >> "$GITHUB_OUTPUT"; else echo "mode=oidc" >> "$GITHUB_OUTPUT"; fi
      - name: Install an npm that supports trusted publishing
        if: steps.package.outputs.published != 'true' && steps.credential.outputs.mode == 'oidc'
        run: |
          npm install -g npm@11
          npm --version
          # setup-node's registry-url adds an _authToken line that reads an
          # empty NODE_AUTH_TOKEN; drop it so npm negotiates OIDC instead.
          npm config delete //registry.npmjs.org/:_authToken --location=user || true
      - name: Check configured npm publishing credentials
        if: steps.package.outputs.published != 'true' && steps.credential.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami --registry=https://registry.npmjs.org > /dev/null || {
            echo "npm authentication failed. Verify NPM_TOKEN and package publish permissions; provenance does not grant registry access."
            exit 1
          }
      - name: Publish only the verified tarball (stored token)
        if: steps.package.outputs.published != 'true' && steps.credential.outputs.mode == 'token'
        run: npm publish artifacts/npm/*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish only the verified tarball (trusted publishing)
        if: steps.package.outputs.published != 'true' && steps.credential.outputs.mode == 'oidc'
        run: npm publish artifacts/npm/*.tgz --provenance --access public --ignore-scripts

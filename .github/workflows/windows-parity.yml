name: Windows parity

# Runs alongside CI but is its own workflow on purpose: release.yml listens to
# the CI workflow only, so a slow or flaky Windows run never delays the
# release PR. Desktop Release still builds and installs on Windows before any
# installer can be published.

on:
  push:
    # Branch pushes already get the pull_request run; a second, concurrent
    # Windows job per push only added runner contention and timeouts.
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: windows-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source-level Windows regressions on every PR; installed NSIS/MSI tests
  # also run in Desktop Release before its artifacts can reach publication.
  # The jsdom client suite is not repeated here: it runs on Linux in CI.
  windows-parity:
    strategy:
      fail-fast: false
      matrix:
        # ARM64 shares the code paths; run it on main pushes only and keep
        # pull requests on the faster x64 runner.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["windows-latest", "windows-11-arm"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Keep independent checks running after a failure so one run exposes every
    # regression. No continue-on-error: any failed check still fails the job.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: "./src-tauri -> target"
          # A red run must not force the next one to rebuild the fixtures.
          cache-on-failure: true
      - id: root-dependencies
        run: npm ci
      - id: client-dependencies
        run: npm ci --prefix client
      - if: ${{ !cancelled() && steps.root-dependencies.outcome == 'success' && steps.client-dependencies.outcome == 'success' }}
        run: npm run typecheck
      - name: Release and packaging helper regressions
        if: ${{ !cancelled() && steps.root-dependencies.outcome == 'success' && steps.client-dependencies.outcome == 'success' }}
        run: npm run test:scripts
      - name: Native Windows filesystem, execution and shutdown regressions
        if: ${{ !cancelled() && steps.root-dependencies.outcome == 'success' && steps.client-dependencies.outcome == 'success' }}
        run: >-
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 --retry=1
          server/windows-filesystem.integration.test.ts server/windows-execution.integration.test.ts
          server/windows-background-containment.integration.test.ts
          server/host-control.test.ts server/util/win-spawn.test.ts server/plugins/codex-spawn.test.ts
          server/util/windows-provider-shell.test.ts server/util/cli-prompt-windows.test.ts
          server/background-windows-bootstrap.test.ts server/background-windows-job-control.test.ts
          server/loop-executors-shell.test.ts
          server/mobile/mobile-redact.test.ts server/provider-detection.test.ts
      - id: production-build
        if: ${{ !cancelled() && steps.root-dependencies.outcome == 'success' && steps.client-dependencies.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
        run: npm run check:package
      - name: Build native host and WebView2 smoke fixtures on this architecture
        id: native-build
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
        # Compile native APIs without pretending to assemble an installer here.
        # Release jobs separately build + validate the complete runtime resources.
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bins --examples --features native-browser-smoke
      - name: Native host regression tests
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
        run: cargo test --locked --lib --features native-browser-smoke
      - name: Native WebView2 capture and selector smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
        run: pwsh ..\scripts\run-native-smoke.ps1 -Exe .\target\debug\examples\native-browser-smoke.exe
      - name: Native WebView2 authentication popup smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
        run: pwsh ..\scripts\run-native-smoke.ps1 -Exe .\target\debug\examples\native-browser-popup-smoke.exe
      - name: Native independent mission window and handoff smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
        run: pwsh ..\scripts\run-native-smoke.ps1 -Exe .\target\debug\examples\native-mission-window-smoke.exe
      - name: Native WebView2 multiwindow session and parking smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
        run: pwsh ..\scripts\run-native-smoke.ps1 -Exe .\target\debug\examples\native-browser-multiwindow-smoke.exe
      # Minidumps written by Windows Error Reporting for a fixture that died
      # with a native exception (issue #638), plus the matching PDB.
      - name: Upload native smoke crash dumps
        if: ${{ always() && steps.native-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: native-smoke-dumps-${{ matrix.os }}
          path: ${{ runner.temp }}/native-smoke-dumps/
          if-no-files-found: ignore
          retention-days: 7

  # Exercise the ARM containment regression before merge, without repeating the
  # complete Rust/WebView build that already runs on main.
  arm-background-containment:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Native ARM background containment (no retries)
        run: >-
          node node_modules/vitest/vitest.mjs run --maxWorkers=2
          server/windows-background-containment.integration.test.ts
          server/background-windows-bootstrap.test.ts server/background-windows-job-control.test.ts
